[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nfl-highlight-clipper"
version = "0.1.0"
description = "Automatically detect and clip highlights from NFL game footage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "librosa",
    "opencv-python",
    "faster-whisper",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_highlight_clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
